<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>Nリウム</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700;800&family=Shippori+Antique+B1&family=Archivo:wght@600;800&family=Rajdhani:wght@600;700&family=Murecho:wght@500;700&family=M+PLUS+Rounded+1c:wght@500;800&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Old+Mincho:wght@700;900&family=DotGothic16&display=swap" />
<style>
button, [role="button"], select, summary { min-height: 2.25rem;}
* { box-sizing: border-box;}
:root{
--bg:#eceff1; --panel:#ffffff; --ink:#1c2126; --muted:#5b6570; --line:#d7dde2;
--accent:#c7431f; --accent-ink:#ffffff;
--sans:"LINE Seed JP","Hiragino Sans","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){
:root{ --bg:#12161a; --panel:#1b2127; --ink:#e8edf1; --muted:#9aa7b1; --line:#2c353d; --accent:#ff8a5f; --accent-ink:#2a1208;}
}
body{ margin:0; background:var(--bg); color:var(--ink); font:400 16px/1.75 var(--sans);}
.page{ max-width:880px; margin:0 auto; padding:40px 18px 72px;}
h1{ font-size:clamp(24px,5vw,34px); font-weight:900; line-height:1.35; margin:0 0 10px; letter-spacing:.02em;}
.lead{ margin:0 0 6px; color:var(--muted); font-size:15px; max-width:640px;}
.lead b{ color:var(--ink);}

/* Concept cards */
.concepts{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin:28px 0 8px;}
@media (max-width:680px){.concepts{ grid-template-columns:1fr;}}
.concept{ text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 16px 14px; cursor:pointer; font:inherit; color:inherit; display:flex; flex-direction:column; gap:8px; transition:border-color.15s, box-shadow.15s;}
.concept[aria-pressed="true"]{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset;}
.concept .tag{ font-size:12px; font-weight:900; letter-spacing:.14em; color:var(--accent);}
.concept .name{ font-size:19px; font-weight:900; line-height:1.3;}
.concept .desc{ font-size:13.5px; color:var(--muted); line-height:1.65;}
.swatches{ display:flex; gap:6px; margin-top:2px;}
.swatches i{ width:22px; height:22px; border-radius:6px; border:1px solid rgba(0,0,0,.12);}

/* Tabs */
.tabs{ position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:8px; padding:12px 0; background:var(--bg);}
.tab{ flex:1 1 21%; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:99px; font:700 13.5px var(--sans); padding:10px 6px; cursor:pointer; min-height:44px;}
.tab[aria-selected="true"]{ background:var(--ink); color:var(--bg); border-color:var(--ink);}

/* Preview frame */
.frame{ border:1px solid var(--line); border-radius:26px; overflow:hidden; box-shadow:0 18px 44px rgba(10,20,30,.16);}
.framebar{ display:flex; align-items:center; gap:8px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); font-size:12.5px; color:var(--muted); font-weight:700; letter-spacing:.04em;}
.framebar i{ width:9px; height:9px; border-radius:50%; background:var(--line);}
.preview{ display:none;}
.preview.on{ display:block;}

/* Points + comparison */
.points{ margin:26px 0 0; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px 20px;}
.points h2{ margin:0 0 8px; font-size:17px; font-weight:900;}
.points ul{ margin:0; padding-left:1.2em; font-size:14.5px; color:var(--muted);}
.points li{ margin:4px 0;}
.points li b{ color:var(--ink);}
.pt{ display:none;}.pt.on{ display:block;}
.cmp{ margin:26px 0 0; width:100%; border-collapse:collapse; font-size:14px; background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden;}
.cmp th,.cmp td{ padding:10px 14px; border-top:1px solid var(--line); text-align:left; vertical-align:top;}
.cmp thead th{ border-top:none; font-weight:900; background:color-mix(in srgb, var(--panel) 88%, var(--bg));}
.cmp th:first-child{ color:var(--muted); font-weight:700; white-space:nowrap;}
@media (max-width:680px){
.cmp{ display:block; overflow-x:visible;}
.cmp table,.cmp thead,.cmp tbody,.cmp tr,.cmp th,.cmp td{ display:block;}
.cmp thead{ display:none;}
.cmp tr{ border-top:1px solid var(--line); padding:6px 0;}
.cmp tr:first-child{ border-top:none;}
.cmp th,.cmp td{ border-top:none; padding:4px 14px;}
.cmp th:first-child{ padding-top:8px;}
}
.closing{ margin:30px 0 0; font-size:15px;}
.closing b{ background:linear-gradient(transparent 62%, color-mix(in srgb, var(--accent) 32%, transparent) 62%);}
footer{ margin-top:44px; font-size:12.5px; color:var(--muted);}
a{ color:var(--accent);}
@media (prefers-reduced-motion: reduce){ *{ transition:none!important;}}

/* ===== 本番用（production-v4）最終調整：プレビューの外枠を排し、固定メニューを最上部に ===== */
body{ background:#F2F7F5;}
.mfix{ top:0;}
</style>
<style>
/* ============ 共通（プレビュー内） ============ */
.pv{ font-size:15px;}
.pv a{ text-decoration:none;}
.pv .cal-note{ font-size:12.5px; opacity:.65; margin:0;}
.pv .calembed iframe{ display:block; width:100%; height:460px; border:0; background:#fff;}
.sec-side .calembed iframe{ height:340px;}
.pv .calgrid{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; font-size:13px; text-align:center;}
.pv .calgrid .dow{ font-weight:700; opacity:.6; padding:3px 0;}
.pv .calgrid .d{ padding:5px 0;}
.pv .calgrid .today{ font-weight:900;}
.pv .legend{ display:flex; flex-wrap:wrap; gap:6px 16px; list-style:none; margin:10px 0 0; padding:0; font-size:13.5px; font-weight:700;}
.pv .legend i{ display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px;}
.pv .vid{ display:block;}
.pv .vid .thumb{ display:block; position:relative; aspect-ratio:16/9; overflow:hidden;}
.pv .vid img{ width:100%; height:100%; object-fit:cover; display:block;}
.pv .vid .playb{ position:absolute; inset:0; display:grid; place-items:center;}
.pv .vid .playb span{ width:58px; height:58px; border-radius:50%; display:grid; place-items:center;}
.pv .vid .playb svg{ width:24px; height:24px; margin-left:3px;}
.pv .steps{ margin:0; padding:0; list-style:none; counter-reset:s; display:flex; flex-direction:column; gap:9px;}
.pv .steps li{ counter-increment:s; display:flex; gap:10px; align-items:flex-start;}
.pv .steps li::before{ content:counter(s); flex:none; width:24px; height:24px; margin-top:2px; font-size:12.5px; font-weight:700; display:grid; place-items:center;}

/* ============ 案Bベース 共通 ============ */
.pv-b{ background:#ffffff; color:#111111; font-family:"LINE Seed JP","Hiragino Sans","Noto Sans JP",sans-serif; padding:44px 22px 52px;}
.pv-b .inner{ max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:38px;}
.pv-b .phead{ border:2px solid #111; padding:22px 20px 18px;}
.pv-b .phead .kicker{ font:800 11px "Archivo",sans-serif; letter-spacing:.3em; margin:0 0 10px;}
.pv-b .phead .kicker em{ font-style:normal; color:#e4572e;}
.pv-b h2.logo{ font-size:40px; font-weight:900; margin:0; letter-spacing:.04em; line-height:1.15;}
.pv-b .phead .sub{ margin:10px 0 0; font-size:14px; font-weight:500;}
.pv-b section{ display:flex; flex-direction:column; gap:14px;}
.pv-b .shead{ display:flex; align-items:center; gap:10px; margin:0; font-size:16px; font-weight:900; letter-spacing:.06em;}
.pv-b .shead .no{ background:#111; color:#fff; font:800 11px "Archivo",sans-serif; padding:4px 8px; letter-spacing:.1em;}
.pv-b .shead::after{ content:""; flex:1; height:2px; background:#111;}
/* プロジェクト：2列グリッド（左列に架争9区・ダリンリヒを上下、右列にNIWA EELS） */
.pv-b .projgrid{ display:grid; grid-template-columns:1fr; gap:14px; align-items:stretch;}
.pv-b .proj{ border:2px solid #111; padding:18px 16px 16px; display:flex; flex-direction:column; gap:12px; min-width:0;}
.pv-b .proj.slot-a{ grid-area:pa;}
.pv-b .proj.slot-b{ grid-area:pb;}
.pv-b .proj.slot-c{ grid-area:pc;}
.pv-b .proj h3{ margin:0; font-size:24px; line-height:1.3; overflow-wrap:break-word;}
.pv-b .f-future h3{ font-family:"Rajdhani","Murecho",sans-serif; letter-spacing:.08em;}
.pv-b .f-art h3{ font-family:"Shippori Antique B1",serif; font-weight:400;}
.pv-b .f-round h3{ font-family:"M PLUS Rounded 1c",sans-serif; font-weight:800;}
.pv-b .desc{ margin:3px 0 0; font-size:14px; font-weight:700; color:#c7431f; letter-spacing:.04em;}
.pv-b .chips{ display:flex; flex-wrap:wrap; gap:8px;}
.pv-b .chip{ display:inline-flex; align-items:center; min-height:40px; padding:8px 14px; border:2px solid #111; color:#111; font-size:13.5px; font-weight:700; background:#fff; overflow-wrap:break-word;}
.pv-b a.chip:hover{ background:#111; color:#fff;}
.pv-b .chip.fill{ background:#111; color:#fff;}
.pv-b .chip.sm{ font-size:13px; min-height:38px; padding:6px 11px;}
.pv-b span.chip{ color:#8a8a8a; border-color:#c9c9c9;}
.pv-b .grp{ margin:10px 0 0; font-size:13px; font-weight:900; letter-spacing:.12em; flex-basis:100%;}
.pv-b .grp::before{ content:"■ "; color:#e4572e; font-size:10px;}
.pv-b .nftlabel{ margin:14px 0 0; padding-top:12px; border-top:2px solid #111; font-size:13px; font-weight:900; letter-spacing:.12em;}
.pv-b .info{ font-size:14px; margin:0;}
.pv-b .info b{ background:#111; color:#fff; padding:1px 8px; margin-right:14px; font-size:12.5px;}
.pv-b .quote{ margin:0; font-size:13.5px; font-weight:700; border-left:4px solid #e4572e; padding-left:10px;}
.pv-b .calwrap{ border:2px solid #111; padding:14px;}
.pv-b .calgrid .today{ background:#e4572e; color:#fff;}
.pv-b .vid{ border:2px solid #111; color:#111;}
.pv-b .vid .playb span{ background:#e4572e; color:#fff;}
.pv-b .vid .vt{ margin:0; padding:12px 14px 2px; font-size:14px; font-weight:900; line-height:1.55;}
.pv-b .vid .vs{ display:block; padding:0 14px 12px; font-size:13px; font-weight:700; color:#666;}
.pv-b .btn{ display:inline-flex; align-items:center; min-height:46px; padding:10px 22px; background:#e4572e; color:#fff; font-size:14px; font-weight:900; letter-spacing:.05em; margin-top:14px;}
.pv-b .barter{ border:2px solid #111; padding:18px 16px; display:flex; flex-direction:column; gap:12px; align-items:flex-start;}
.pv-b .barter p{ margin:0; font-size:14px;}
.pv-b .barter .lead{ font-size:19px; font-weight:900;}
.pv-b .steps li::before{ background:#111; color:#fff;}
.pv-b .events{ display:grid; grid-template-columns:1fr 1fr; gap:8px; list-style:none; margin:0; padding:0;}
.pv-b .events li{ border:2px solid #111; padding:10px 12px; font-size:13.5px; font-weight:700;}
.pv-b .news-lead{ margin:0 0 10px; font-size:17.5px; font-weight:900; line-height:1.55; letter-spacing:.02em;}
.pv-b .newslist{ list-style:none; margin:0; padding:0; border:2px solid #111; background:#fff;}
.pv-b .newslist li{ display:flex; gap:12px; align-items:baseline; padding:11px 14px; font-size:14px; line-height:1.65;}
.pv-b .newslist li + li{ border-top:1px dotted #111;}
.pv-b .newslist .ntag{ flex:none; font-size:11.5px; font-weight:900; letter-spacing:.08em; background:#111; color:#fff; padding:2px 9px; transform:translateY(-1px);}
.pv-b .newslist .ntext{ flex:1; min-width:0; overflow-wrap:break-word;}
.pv-b .newslist a{ color:#111; text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px;}
.pv-b .newslist a:hover{ color:#c7431f;}
@media (max-width:600px){
.pv-b .newslist li{ flex-direction:column; gap:5px; padding:10px 12px;}
.pv-b .newslist .ntag{ transform:none;}
}
.pv-b .foot{ font:800 11px "Archivo",sans-serif; letter-spacing:.24em; text-align:center;}

/* ============ B1 標準グリッド（元の案Bそのまま＋縦2列） ============ */
/* 追加の上書きなし：共通スタイルがそのままB1 */

/* ============ B2 タイトグリッド ============ */
.pv-v2{ padding:36px 18px 44px;}
.pv-v2 .inner{ gap:28px;}
.pv-v2 .phead{ border:3px solid #111; background:#111; color:#fff; padding:18px 18px 16px;}
.pv-v2 .phead .kicker{ display:inline-block; background:#c7431f; color:#fff; padding:5px 10px; margin:0 0 12px;}
.pv-v2 .phead .kicker em{ color:#ffd9c7;}
.pv-v2 .shead{ background:#111; color:#fff; padding:9px 12px;}
.pv-v2 .shead .no{ background:#c7431f; color:#fff;}
.pv-v2 .shead::after{ display:none;}
.pv-v2 section{ gap:10px;}
.pv-v2 .projgrid{ gap:0;}
.pv-v2 .proj{ border:3px solid #111; padding:14px 13px 13px;}
.pv-v2 .proj h3{ font-size:22px;}
.pv-v2 .chips{ gap:6px;}
.pv-v2 .chip{ min-height:36px; padding:6px 11px; font-size:13px;}
.pv-v2 .chip.sm{ min-height:33px;}
.pv-v2 .nftlabel{ background:#c7431f; color:#fff; border-top:none; padding:6px 10px;}
.pv-v2 .calwrap,.pv-v2 .barter,.pv-v2 .vid{ border:3px solid #111;}
.pv-v2 .calgrid .today{ background:#111;}
.pv-v2 .vid .playb span{ background:#111;}
.pv-v2 .btn{ background:#111;}
.pv-v2 .events{ gap:0;}
.pv-v2 .events li{ border:3px solid #111;}

/* ============ B3 ワイドグリッド ============ */
.pv-v3{ padding:56px 30px 60px;}
.pv-v3 .inner{ gap:48px;}
.pv-v3 .phead{ border:none; border-top:6px solid #e4572e; padding:24px 2px 0;}
.pv-v3 h2.logo{ font-size:50px;}
.pv-v3 .phead .sub{ font-size:13.5px;}
.pv-v3 section{ gap:16px;}
.pv-v3 .shead{ font-size:20px; border-bottom:4px solid #111; padding-bottom:10px;}
.pv-v3 .shead .no{ background:none; color:#c7431f; font:800 19px "Archivo",sans-serif; padding:0;}
.pv-v3 .shead::after{ display:none;}
.pv-v3 .projgrid{ gap:20px;}
.pv-v3 .proj{ padding:24px 20px 20px;}
.pv-v3 .proj h3{ font-size:26px;}
.pv-v3 .chips{ flex-direction:column; align-items:stretch; flex-wrap:nowrap; gap:7px;}
.pv-v3 .chip{ width:100%; justify-content:space-between; min-height:44px;}
.pv-v3 a.chip::after{ content:"→"; color:#c7431f; flex:none; margin-left:8px;}
.pv-v3 a.chip:hover::after{ color:#fff;}
.pv-v3 .calwrap{ padding:20px;}
.pv-v3 .barter{ padding:24px 20px;}
.pv-v3 .btn{ background:#111;}
.pv-v3 .vid .playb span{ background:#111;}
.pv-v3 .events{ gap:10px;}
.pv-v3 .events li{ padding:13px 14px;}

/* スマホでも2列を維持する（NIWA EELSのXから来る人と、ダリンリヒ／架争9区のXから来る人、
   どちらの入口もトップに並べるため1列には落とさない）。
   代わりに列の中を読みやすくする：外側の余白を削って列幅を稼ぎ、文字を小さめにそろえ、
   リンクは列幅いっぱいの行にして、情報ラベルは縦に積む。 */
@media (max-width:600px){
.page{ padding:26px 10px 56px;}
.frame{ border-radius:18px;}
.pv-b{ padding:28px 10px 36px;}
.pv-b .inner{ gap:28px;}
.pv-b .phead{ padding:16px 14px 14px;}
.pv-b h2.logo{ font-size:30px;}
.pv-b .shead{ font-size:15px; gap:8px;}
.pv-b .projgrid{ grid-template-columns:1fr; gap:10px;}
.pv-b .proj{ padding:12px 9px 11px; gap:9px;}
.pv-b .proj h3{ font-size:21px; line-height:1.3; letter-spacing:.01em; overflow-wrap:break-word; word-break:normal; line-break:strict;}
.pv-b .f-round h3{ letter-spacing:.03em;}
.pv-b .desc{ font-size:13.5px; line-height:1.55; letter-spacing:0; margin-top:4px;}
.pv-b .chips{ gap:7px;}
.pv-b .chip{ font-size:13.5px; line-height:1.45; min-height:42px; padding:8px 12px; overflow-wrap:break-word; line-break:strict;}
.pv-b .chip.sm{ font-size:13px; min-height:40px; padding:7px 11px;}
.pv-b .info{ font-size:13.5px; line-height:1.65;}
.pv-b .info b{ margin-right:10px;}
.pv-b .nftlabel{ font-size:12.5px; letter-spacing:.05em; line-height:1.5; margin-top:8px; padding-top:9px;}
.pv-b .grp{ font-size:12.5px; letter-spacing:.03em; line-height:1.5; margin-top:8px;}
.pv-b .quote{ font-size:13px; line-height:1.65;}
.pv-b .calwrap{ padding:10px 8px;}
.pv-b .barter{ padding:14px 12px;}
.pv-v2{ padding:22px 7px 30px;}
.pv-v2 .inner{ gap:22px;}
.pv-v2 .projgrid{ gap:0;}
.pv-v2 .proj{ border-width:2px; padding:10px 7px 9px;}
.pv-v2 .proj h3{ font-size:17px;}
.pv-v2 .chip{ border-width:2px;}
.pv-v2 .calwrap,.pv-v2 .barter,.pv-v2 .vid,.pv-v2 .events li{ border-width:2px;}
.pv-v3{ padding:38px 12px 44px;}
.pv-v3 .inner{ gap:36px;}
.pv-v3 .projgrid{ gap:10px;}
.pv-v3 .proj{ padding:15px 10px 13px;}
.pv-v3 .proj h3{ font-size:19px;}
.pv-v3 .chip{ justify-content:space-between; text-align:left; font-size:12px; padding:8px 9px;}
.pv-v3 h2.logo{ font-size:38px;}
.pv-v3 .shead{ font-size:18px;}
}

/* ============ E B1×D 合体（B1の骨格＋Dのプロジェクト色分け）／ pv-i はEの丸角チップ版 ============ */
.pv-e .proj, .pv-i .proj{ --tbg:#f4f4f4; --tink:#111111; --tacc:#c7431f; background:var(--tbg);}
.pv-e .proj.th-kaso, .pv-i .proj.th-kaso{ --tbg:#d8edf3; --tink:#0c5a6d; --tacc:#0c7d99;}
.pv-e .proj.th-darin, .pv-i .proj.th-darin{ --tbg:#ece5f7; --tink:#7559a8; --tacc:#7559a8;}
.pv-e .proj.th-niwa, .pv-i .proj.th-niwa{ --tbg:#dfe8fd; --tink:#2b59c3; --tacc:#d3501f;}
.pv-e .proj.th-gozen, .pv-i .proj.th-gozen{ --tbg:#cdeffb; --tink:#075985; --tacc:#0284c7;}
.pv-e .desc, .pv-i .desc{ color:var(--tink);}
.pv-e .chip, .pv-i .chip{ background:#ffffff;}
.pv-e a.chip:hover, .pv-i a.chip:hover{ background:var(--tink); border-color:var(--tink); color:#ffffff;}
.pv-e .grp::before, .pv-i .grp::before{ color:var(--tacc);}
.pv-e .info b, .pv-i .info b{ background:var(--tink);}
.pv-e .quote, .pv-i .quote{ border-left-color:var(--tacc);}
/* E丸角：プロジェクトのリンク（チップ）だけ少し丸角に */
.pv-i .proj .chip{ border-radius:10px;}

/* 「架争9区について」を主ボタンとして目立たせる（全幅・大きめ・色で塗る） */
.pv-b .chip.hero{ flex-basis:100%; justify-content:center; font-size:16.5px; font-weight:900; min-height:54px; padding:12px 16px; background:#111; border-color:#111; color:#fff; letter-spacing:.04em;}
.pv-b a.chip.hero::after{ content:"→"; margin-left:10px; font-weight:900; flex:none;}
.pv-b a.chip.hero:hover{ background:#000; border-color:#000; color:#fff;}
.pv-e .chip.hero, .pv-i .chip.hero{ background:var(--tacc); border-color:var(--tacc);}
.pv-e a.chip.hero:hover, .pv-i a.chip.hero:hover{ background:var(--tink); border-color:var(--tink);}
.pv-d .d-row.hero{ background:var(--tink); color:#fff; font-size:16.5px; font-weight:900; padding:15px 16px;}
.pv-d a.d-row.hero{ justify-content:space-between;}
.pv-d .d-row.hero::after{ content:"→"; font-weight:900; flex:none;}

/* 「架争9区について」を“見出し帯”ではなく押せるボタンに見せる：ピル形＋下側の厚み（影）＋白丸の矢印バッジ */
.pv-b .chip.hero{ border-radius:999px; flex-basis:calc(100% - 8px); margin:2px 4px 7px; padding:12px 18px; box-shadow:0 5px 0 var(--tink, #111); text-decoration:none;}
.pv-b a.chip.hero::after{ content:"→"; width:30px; height:30px; border-radius:50%; background:#fff; color:var(--tacc, #111); display:grid; place-items:center; font-size:15px; line-height:1; margin-left:12px; flex:none;}
.pv-b a.chip.hero:active{ transform:translateY(3px); box-shadow:0 2px 0 var(--tink, #111);}
.pv-d .d-row.hero{ border-radius:999px; margin:2px 2px 7px; padding:13px 20px; box-shadow:0 5px 0 rgba(20,26,32,.38);}

.pv-d .d-menu-text a{ flex:1 1 0; display:flex; align-items:center; justify-content:center; min-height:48px; padding:9px 6px; border-radius:12px; background:#eef1f3; color:#23272b; font-size:16px; font-weight:900; letter-spacing:.04em; line-height:1.3; text-align:center; white-space:nowrap; box-shadow:0 6px 16px rgba(20,26,32,.14);}
.pv-d .d-menu-text a[data-menu="kaso"]{ background:#d8edf3; color:#0c5a6d;}
.pv-d .d-menu-text a[data-menu="niwa"]{ background:#dfe8fd; color:#2b59c3;}
@media (max-width:600px){
.pv-b .pmenu-text{ gap:6px;}
.pv-b .pmenu-text a{ font-size:13.5px; min-height:44px; padding:7px 3px;}
.pv-d .d-menu-text{ gap:6px;}
.pv-d .d-menu-text a{ font-size:13.5px; min-height:44px; padding:7px 3px;}
}

/* ============ E派生（Eを土台に、色の面積を変えた3案） ============ */
/* E2 バンド：カードの地は白、プロジェクト名の帯とチップの枠に色 */
.pv-f .proj{ --band:#111111; --tink:#111111; --tacc:#c7431f; background:#ffffff;}
.pv-f .proj.th-kaso{ --band:#0c7d99; --tink:#0c5a6d; --tacc:#0c7d99;}
.pv-f .proj.th-darin{ --band:#7559a8; --tink:#7559a8; --tacc:#7559a8;}
.pv-f .proj.th-niwa{ --band:#2b59c3; --tink:#2b59c3; --tacc:#d3501f;}
.pv-f .proj h3{ background:var(--band); color:#ffffff; margin:-18px -16px 0; padding:11px 13px;}
.pv-f .desc{ color:var(--tink);}
.pv-f .chip{ border-color:var(--band);}
.pv-f a.chip:hover{ background:var(--band); border-color:var(--band); color:#ffffff;}
.pv-f .grp::before{ color:var(--tacc);}
.pv-f .info b{ background:var(--band);}
.pv-f .quote{ border-left-color:var(--tacc);}
@media (max-width:600px){ .pv-f .proj h3{ margin:-12px -9px 0; padding:8px 9px;} }

/* E3 カラーチップ：Eの淡い地色のまま、チップまでプロジェクト色で塗る／ pv-j はE3の丸角チップ版 */
.pv-g .proj, .pv-j .proj{ --tbg:#f4f4f4; --tink:#111111; --tacc:#c7431f; --chip:#111111; background:var(--tbg);}
.pv-g .proj.th-kaso, .pv-j .proj.th-kaso{ --tbg:#e2f1f5; --tink:#0c5a6d; --tacc:#0c7d99; --chip:#0c7d99;}
.pv-g .proj.th-darin, .pv-j .proj.th-darin{ --tbg:#f0eaf9; --tink:#7559a8; --tacc:#7559a8; --chip:#7559a8;}
.pv-g .proj.th-niwa, .pv-j .proj.th-niwa{ --tbg:#e4ebfd; --tink:#2b59c3; --tacc:#d3501f; --chip:#2b59c3;}
.pv-g .desc, .pv-j .desc{ color:var(--tink);}
.pv-g .chip, .pv-j .chip{ background:var(--chip); border-color:var(--chip); color:#ffffff;}
.pv-g a.chip:hover, .pv-j a.chip:hover{ background:#111111; border-color:#111111; color:#ffffff;}
.pv-g span.chip, .pv-j span.chip{ background:#e9e9e9; border-color:#c9c9c9; color:#8a8a8a;}
.pv-g .grp::before, .pv-j .grp::before{ color:var(--tacc);}
.pv-g .info b, .pv-j .info b{ background:var(--chip);}
.pv-g .quote, .pv-j .quote{ border-left-color:var(--tacc);}
/* E3丸角：プロジェクトのリンク（チップ）だけ少し丸角に */
.pv-j .proj .chip{ border-radius:10px;}
/* E3：主ボタン（架争9区について）もプロジェクト色で塗る */
.pv-g .chip.hero, .pv-j .chip.hero{ background:var(--chip); border-color:var(--chip);}
.pv-g a.chip.hero:hover, .pv-j a.chip.hero:hover{ background:#111111; border-color:#111111;}

/* E4 濃色カード：カード全体を濃いプロジェクト色にして白文字に */
.pv-h .proj{ --tbg:#3a3f44; --tink:#e8edf1; --tacc:#ffb59d; background:var(--tbg); color:#ffffff;}
.pv-h .proj.th-kaso{ --tbg:#0a5a70; --tink:#bfe6f0; --tacc:#8fd3e6;}
.pv-h .proj.th-darin{ --tbg:#5b4390; --tink:#e0d4f7; --tacc:#cdbcf2;}
.pv-h .proj.th-niwa{ --tbg:#1f4396; --tink:#c9d9fc; --tacc:#ffab7a;}
.pv-h .desc{ color:var(--tink);}
.pv-h .chip{ background:transparent; border-color:#ffffff; color:#ffffff;}
.pv-h a.chip:hover{ background:#ffffff; border-color:#ffffff; color:#111111;}
.pv-h span.chip{ color:rgba(255,255,255,.55); border-color:rgba(255,255,255,.45);}
.pv-h .grp::before{ color:var(--tacc);}
.pv-h .info b{ background:#ffffff; color:#1c2126;}
.pv-h .quote{ border-left-color:var(--tacc);}
.pv-h .nftlabel{ border-top-color:rgba(255,255,255,.55);}

/* ============ E フォント一新（Eベース：レイアウト・色・メニューはEと同一、書体だけ変更） ============
   本文＝LINE Seed JP（ゴシックは全案共通で差し替え済み）、見出し・プロジェクト名・メニュー＝Zen Old Mincho（明朝） */
.pv-k{ font-family:"LINE Seed JP","Hiragino Sans","Noto Sans JP",sans-serif;}
.pv-k h2.logo, .pv-k .shead, .pv-k .proj h3, .pv-k .pmenu a, .pv-k .pmenu-sub a, .pv-k .chip.hero, .pv-k .btn, .pv-k .barter .lead{ font-family:"Zen Old Mincho","Hiragino Mincho ProN","YuMincho",serif; font-weight:900; letter-spacing:.05em;}
.pv-k .proj h3{ font-weight:900;}
.mfix.pv-k .pmenu-mini a{ font-family:"Zen Old Mincho","Hiragino Mincho ProN",serif; font-weight:900;}

/* ============ 決定案ロゴ専用フォント「どんぐりデュエル」(x10y12pxDonguriDuel / 作者 hicc・x0y0pxFreeFont) ============
   ZeoSeven Fonts の result.css（https://fontsapi.zeoseven.com/2135/main/result.css）は現在404のため、
   公式配布TTFを  に自己ホストし、同一フォントのCDN配信（ZSFT-2135）を予備に併記する。
   適用範囲は決定案のロゴ「Nリウム」のみ。他のドット文字箇所・他案には使わない */
@font-face{ font-family:"ZSFT-2135"; src:url("x10y12pxDonguriDuel.woff2") format("woff2"), url("https://fontsapi.zeoseven.com/2135/main.woff2") format("woff2"), url("x10y12pxDonguriDuel.ttf") format("truetype"); font-style:normal; font-weight:400; font-display:swap;}

/* ============ 決定案2専用フォント「PixelMplus」(itouhiro／M+ FONT LICENSE) ============
   公式リポジトリ（github.com/itouhiro/PixelMplus）の PixelMplus12 を woff2 化して自己ホスト。
   適用範囲は決定案2のドット風フォント箇所のみ。ロゴ（どんぐりデュエル）と本文（LINE Seed JP）は使わない */
@font-face{ font-family:"PixelMplus"; src:url("PixelMplus12-Regular.woff2") format("woff2"); font-style:normal; font-weight:400; font-display:swap;}
@font-face{ font-family:"PixelMplus"; src:url("PixelMplus12-Bold.woff2") format("woff2"); font-style:normal; font-weight:700; font-display:swap;}

/* ============ 決定案 ピクセル×色分け（案7改）：骨格・文言・テーマカラーはEのまま、
   見出しをドット文字（DotGothic16）にし、白地＋黒2px罫線＋角丸でトンマナを寄せる ============ */
.pv-x{ --dot:"DotGothic16","LINE Seed JP",sans-serif; background:#F2F7F5;}
.pv-x .phead{ text-align:center;}
.pv-x h2.logo{ font-family:"ZSFT-2135","DotGothic16","LINE Seed JP",sans-serif; font-weight:400; font-size:54px; letter-spacing:.06em; color:#111;}
.pv-x .shead{ font-family:var(--dot); font-weight:400; font-size:16px; letter-spacing:.06em;}
/* 決定案のみ：見出し「Projects」の文字だけ少し小さくする（ドット線・他の見出しはそのまま） */
.pv-x section[data-sec="project"] .shead{ font-size:13px;}
.pv-x .shead .no{ display:none;}
.pv-x .shead::after{ content:""; flex:1; height:0; background:none; border-top:3px dotted #111;}
.pv-x .proj{ border-radius:16px;}
.pv-x .proj h3{ font-family:var(--dot); font-weight:400; letter-spacing:.04em;}
.pv-x .pmenu a{ font-family:var(--dot); font-weight:400;}
.pv-x .pmenu a, .pv-x .pmenu a .mlabel{ color:#111;}
.pv-x .pmenu a .mlabel{ font-weight:400;}
/* 決定案の1段目メニュー：共通の画像メニューそのまま
   （画像いっぱいの正方形ボタン＝角丸＋黒枠、ラベルはボタンの下＝枠の外、その下にオレンジ▼） */
.pv-x .pmenu-sub a{ border-radius:999px;}
.pv-x .chip{ border-radius:10px;}
.pv-x .calwrap{ border-radius:16px;}
.pv-x .barter{ border-radius:16px;}
.pv-x .vid{ border-radius:14px; overflow:hidden;}
.pv-x .btn{ border-radius:999px;}
.pv-x .events li{ border-radius:10px;}
/* ============ 本セクション（決定案／決定案2／決定案3のみ表示）：表紙＋タイトル＋書店・自家通販チップの2冊カード。
   カードの骨格（白地＋黒2px罫線＋角丸16px）はプロジェクトカードに揃え、リンクは既存 .chip をそのまま使う ============ */
.pv-x .bookgrid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:stretch;}
.pv-x .book{ border:2px solid #111; background:#fff; border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:12px; min-width:0;}
.pv-x .book .cover{ display:block; width:100%; max-width:230px; height:auto; margin:0 auto; border:2px solid #111; border-radius:8px;}
.pv-x .book h3{ margin:0; font-family:var(--dot); font-weight:400; font-size:19px; line-height:1.45; letter-spacing:.03em; text-align:center; overflow-wrap:break-word;}
.pv-x .book .bookdesc{ margin:0; font-size:13.5px; line-height:1.75; overflow-wrap:break-word;}
.pv-x .book .chips{ justify-content:center; margin-top:auto;}
.pv-y .book h3{ font-weight:700;}
@media (max-width:600px){
.pv-x .bookgrid{ gap:10px;}
.pv-x .book{ padding:11px;}
.pv-x .book h3{ font-size:14.5px;}
.pv-x .book .chips{ flex-direction:column; align-items:stretch; flex-wrap:nowrap; gap:6px;}
.pv-x .book .chip{ justify-content:center; min-height:38px; padding:7px 6px; font-size:12.5px; white-space:nowrap;}
}
/* ニュースのキャンペーン告知：点線枠＋白地のボックスに、リード文（通常の太さ）と2件の行を入れる。行間の区切り線は無し。
   「ニュース」の文字は上の枠線に組み込む（fieldsetのlegend風：文字のところで点線が途切れる）。
   今はキャンペーン告知のみなので線なし＋行間・余白を詰める。
   仕様メモ：今後ニュース項目が増えたら、内容（項目）ごとに区切り線を入れる設計にする */
.pv-x .newsbox{ position:relative; border:2px dotted #111; background:#fff; border-radius:16px; padding:14px 14px 11px;}
.pv-x .newsbox .nlegend{ position:absolute; top:-12px; left:14px; margin:0; padding:0 8px; background:#F2F7F5; font-family:var(--dot); font-size:16px; font-weight:400; letter-spacing:.06em; line-height:1.5;}
.pv-x .newsbox .nlead{ margin:0 0 3px; font-size:13.5px; font-weight:400; line-height:1.45;}
.pv-x .newsbox .nrows{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px;}
.pv-x .newsbox .nrows li{ font-size:13px; line-height:1.45; overflow-wrap:break-word;}
.pv-x .newsbox .nrows a{ color:#111; text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px;}
.pv-x .newsbox .nrows a:hover{ color:#0c5a6d;}
/* 決定案・NIWA EELS／ダリンリヒカードのみ：NFT見出し（いろんなNIWA EELS等）は大きく＋太さを一段軽く、
   NFTのリンク類（OpenSea・ヘキサ等）は少し小さくする。「NFT（デジタルグッズ）」ラベルは元の大きさのまま。
   チップ側はNFT領域専用の .nft-chips に限定して当てる（見出しを挟む並び順に依存しない）。他プロジェクト・他案には効かせない */
.pv-x .proj[data-anchor="niwa"] .grp, .pv-x .proj[data-anchor="darin"] .grp{ font-size:16px; font-weight:700;}
.pv-x .proj[data-anchor="niwa"] .nft-chips .chip, .pv-x .proj[data-anchor="darin"] .nft-chips .chip{ font-size:12px; min-height:36px; padding:6px 11px;}
.pv-x .proj[data-anchor="niwa"] .nft-chips .chip.sm, .pv-x .proj[data-anchor="darin"] .nft-chips .chip.sm{ font-size:11.5px; min-height:34px; padding:5px 10px;}
/* 決定案系・NIWA EELSカードのみ：通常リンク（Ｘ／ホームページ／ホルダーさん限定グッズ）を必ず1行に並べる。
   NFTリンク群（.nft-chips）・他カードには触らない。共有クラス .pv-x 経由で決定案／決定案2／決定案3すべてに同じ見た目で効く */
.pv-x .proj[data-anchor="niwa"] .chips:not(.nft-chips){ flex-wrap:nowrap; gap:6px;}
.pv-x .proj[data-anchor="niwa"] .chips:not(.nft-chips) .chip{ white-space:nowrap; flex:0 1 auto; min-width:0;}
@media (max-width:600px){
.pv-x .proj[data-anchor="niwa"] .chips:not(.nft-chips){ gap:4px;}
.pv-x .proj[data-anchor="niwa"] .chips:not(.nft-chips) .chip{ font-size:12px; min-height:38px; padding:7px 6px;}
.pv-x .proj[data-anchor="niwa"] .chips:not(.nft-chips) .chip.sm{ font-size:11px; min-height:36px; padding:6px 5px; letter-spacing:-.03em;}
}
/* 決定案の1段目メニュー：「NIWA EELS」ラベルだけ字間を詰める（ドット文字＋全角幅で広がるため強めに詰める） */
.pv-x .pmenu a[data-menu="niwa"] .mlabel{ letter-spacing:-.14em;}
.pv-x .newslist .ntag{ border-radius:999px; background:#0c7d99;}
.pv-x .newslist li:nth-child(2) .ntag{ background:#2b59c3;}
.pv-x .newslist li:nth-child(3) .ntag{ background:#c7431f;}
.pv-x .newslist li:nth-child(4) .ntag{ background:#7559a8;}
.pv-x .foot{ font-family:var(--dot); letter-spacing:.2em;}
/* 決定案のドット文字（どんぐりデュエル／DotGothic16）箇所だけ、英数字を全角グリフで表示する。
   text-transform:full-width で英数字を全角コードポイント（Ａ・Ｎ・９等）に変換し、
   両フォントが持つ全角グリフで描く（fwid はGSUBを持つフォント向けの併用）。
   かな・漢字は元から全角で変わらない。他案・ドット以外の箇所には効かせない */
.pv-x h2.logo, .pv-x .shead, .pv-x .proj h3, .pv-x .pmenu a, .pv-x .foot, .mfix.pv-x .pmenu-mini a{ font-feature-settings:"fwid" 1; text-transform:full-width;}
.mfix.pv-x .pmenu-mini{ border-radius:0 0 14px 14px;}
.mfix.pv-x .pmenu-mini a{ font-family:"DotGothic16","LINE Seed JP",sans-serif; border-radius:9px;}
@media (max-width:600px){
.pv-x h2.logo{ font-size:38px;}
.pv-x .shead{ font-size:15px;}
.pv-x .newsbox .nlegend{ font-size:15px; top:-11px;}
.pv-x section[data-sec="project"] .shead{ font-size:12.5px;}
.pv-x .pmenu a[data-menu="niwa"] .mlabel{ letter-spacing:-.2em;}
.pv-x .proj[data-anchor="niwa"] .grp, .pv-x .proj[data-anchor="darin"] .grp{ font-size:14.5px;}
.pv-x .proj[data-anchor="niwa"] .nft-chips .chip, .pv-x .proj[data-anchor="darin"] .nft-chips .chip{ font-size:12px; min-height:38px; padding:7px 10px;}
}
/* ============ 決定案：2段目メニューをピクセルアイコン主体に（アイコンの下に小さなラベル） ============ */
.pv-x .pmenu-sub a:nth-child(n){ flex-grow:1;}
.pv-x .pmenu-sub a{ flex-direction:column; gap:3px; min-height:74px; padding:11px 6px 10px;}
.pv-x .pmenu-sub a:hover{ background:#F2F7F5; color:#111; box-shadow:0 3px 0 #111;}
.pv-x .pmenu-sub .sub-icon{ display:grid; place-items:center; width:32px; height:32px; flex:none;}
.pv-x .pmenu-sub .sub-icon svg{ width:32px; height:32px; display:block;}
.pv-x .pmenu-sub .sub-label{ display:block; font-size:11.5px; font-weight:700; line-height:1.25; letter-spacing:.02em;}
@media (max-width:600px){
.pv-x .pmenu-sub a{ min-height:68px; padding:10px 2px 9px; gap:2px;}
.pv-x .pmenu-sub .sub-icon{ width:27px; height:27px;}
.pv-x .pmenu-sub .sub-icon svg{ width:27px; height:27px;}
.pv-x .pmenu-sub .sub-label{ font-size:10.5px; letter-spacing:0;}
}
/* ============ 固定ミニメニュー改善：NIWA EELSを1行に／その他にピクセルの星／決定案トーンに整える ============ */
.mfix .pmenu-mini a{ white-space:nowrap; min-width:0;}
.mfix.pv-x .pmenu-mini{ background:#F2F7F5; border:2px solid #111; border-top:none; border-radius:0 0 16px 16px; box-shadow:0 10px 22px rgba(10,20,30,.18); padding:7px; gap:7px;}
.mfix.pv-x .pmenu-mini a{ border:2px solid #111; border-radius:10px; min-height:40px; padding:6px 4px; box-shadow:0 2px 0 rgba(17,17,17,.85);}
.mfix.pv-x .pmenu-mini a[data-menu="kaso"]{ flex-grow:.95;}
/* 固定メニューの「NIWA EELS」だけ幅広だったのを修正：flex-grow を他ボタン（架争9区 .95／その他 .9）と揃う値にし、3ボタンがほぼ均等幅になるようにする（文字左右の余分な空白を無くす）。1段目メニューには触らない */
.mfix.pv-x .pmenu-mini a[data-menu="niwa"]{ flex-grow:.925; font-size:12.5px; letter-spacing:-.14em;}
.mfix.pv-x .pmenu-mini a[data-menu="other"]{ flex-grow:.9;}
@media (max-width:600px){
.mfix.pv-x .pmenu-mini a[data-menu="niwa"]{ font-size:12px; letter-spacing:-.16em;}
}
/* ============ 決定案／決定案2：プロジェクト／名義タイトルの前後にピクセルの星（色は各カードのテーマ色 --tink に追従） ============ */
.pv-x .proj h3 .tstar{ display:inline-grid; place-items:center; width:.66em; height:.66em; margin-right:.24em; vertical-align:-.03em; color:var(--tink, #111111);}
.pv-x .proj h3 .tstar svg{ width:100%; height:100%; display:block;}
.pv-x .proj h3 .tstar.end{ margin-right:0; margin-left:.24em;}
/* ============ 決定案2：決定案のコピー＋ドット風フォント箇所（--dot 経由の見出し・メニュー・ニュース文字・フッターと固定ミニメニュー）を
   読みやすいドット風フォント「PixelMplus」の太字に差し替える。ロゴ「Nリウム」（どんぐりデュエル）と本文（LINE Seed JP）は決定案のまま変えない ============ */
.pv-y{ --dot:"PixelMplus","LINE Seed JP",sans-serif;}
.pv-y .shead, .pv-y .proj h3, .pv-y .pmenu a, .pv-y .pmenu a .mlabel, .pv-y .newsbox .nlegend, .pv-y .foot{ font-weight:700;}
.pv-y .pmenu a[data-menu="niwa"] .mlabel{ letter-spacing:-.03em;}
.mfix.pv-y .pmenu-mini a{ font-family:"PixelMplus","LINE Seed JP",sans-serif; font-weight:700;}
.mfix.pv-y .pmenu-mini a[data-menu="niwa"]{ letter-spacing:-.05em; font-size:13px;}
@media (max-width:600px){
.pv-y .pmenu a[data-menu="niwa"] .mlabel{ letter-spacing:-.05em;}
.mfix.pv-y .pmenu-mini a[data-menu="niwa"]{ font-size:12.5px; letter-spacing:-.07em;}
}
/* ============ 決定案2のみ：「NIWA EELS」は英字を全角・スペースだけ半角 ============
   決定案2でも「NIWA EELS」の出る箇所（1段目メニューのラベル／プロジェクトタイトル／固定ミニメニュー）は
   決定案と同じく英字を全角幅（text-transform:full-width）で表示するが、NIWAとEELSの間のスペースだけは
   全角だと広すぎるので半角にする。スペースは JS で .hwsp span に包み、その span だけ変換を外して半角幅にする。
   字間の詰めは全角前提の値（決定案と同じ）に戻す。他のタイトル・他案・本文には効かせない */

/* 決定案2のみ：「NIWA EELS」を実際の全角文字＋半角スペースの文字列で描く。
   旧方式（スペースを .hwsp span で包み、英字は text-transform:full-width で全角化）は2点で壊れていた：
   (1) .hwsp に共通ルール「.pv-b .pmenu a span{display:block}」が当たり、スペースの位置で必ず改行した。
   (2) text-transform:full-width が適用されないブラウザでは英字が半角のままだった（PixelMplusにGSUBも無い）。
   そのため対象2か所（決定案2の1段目メニューのラベル／プロジェクトタイトル）のテキストノード自体を
   「ＮＩＷＡ ＥＥＬＳ」（英字=全角コードポイント、スペース=半角U+0020）に置き換える。包む span は
   使わないので改行要因が無く、全角幅はフォント本来の advance（1em）で全ブラウザ共通に効く。
   該当箇所の text-transform:none は CSS 側で指定済み（Safariが半角スペースを全角化するのを防ぐ）。
   固定ミニメニューは全案共通の要素のため、表示中の案が決定案2のときだけ全角文字列に切り替える
   （show() から __setMiniNiwa を呼ぶ。他案では従来どおり半角文字列のまま） */
(function () {
var FWNIWA = "ＮＩＷＡ ＥＥＬＳ";
function fullwidthize(el) {
if (!el) return;
Array.prototype.slice.call(el.childNodes).forEach(function (n) {
if (n.nodeType !== 3) return;
if (n.nodeValue.indexOf("NIWA EELS") < 0) return;
n.nodeValue = n.nodeValue.replace("NIWA EELS", FWNIWA);
});
}
fullwidthize(document.querySelector('#pv-y .pmenu a[data-menu="niwa"] .mlabel'));
fullwidthize(document.querySelector('#pv-y .proj[data-anchor="niwa"] h3'));
window.__setMiniNiwa = function (key) {
var lab = document.querySelector('#mfix a[data-menu="niwa"] .mini-label');
if (!lab) return;
lab.textContent = (key === "y")? FWNIWA: "NIWA EELS";
};
window.__setMiniNiwa("w");
})();

   描画済みの #pv-z 内のテキストノードだけを対象に「架争9区」→「架争９区」へ置き換える。
   ニュースの日付「12/31」や年号など、他の数字には触れない。他案の表示は変わらない。
   固定ミニメニューは全案共通の要素のため、表示中の案が決定案3のときだけ全角に切り替える
   （show() から __setMiniKaso を呼ぶ） */
(function () {
["pv-z", "pv-w"].forEach(function (id) {
var root = document.getElementById(id);
if (!root) return;
var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
var nodes = [];
while (walker.nextNode()) { if (walker.currentNode.nodeValue.indexOf("架争9区") >= 0) nodes.push(walker.currentNode); }
nodes.forEach(function (n) { n.nodeValue = n.nodeValue.split("架争9区").join("架争９区"); });
});
window.__setMiniKaso = function (key) {
var a = document.querySelector('#mfix a[data-menu="kaso"]');
if (!a) return;
a.textContent = (key === "z" || key === "w")? "架争９区": "架争9区";
};
window.__setMiniKaso("w");
})();

/* ページ内ジャンプ（物々交換） */
document.addEventListener("click", function (e) {
var a = e.target.closest("a[data-jump]");
if (!a) return;
var pv = a.closest(".preview");
var t = pv && pv.querySelector("[data-barter]");
if (!t) return;
e.preventDefault();
t.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches? "auto": "smooth", block: "start"});
});

/* ジャンプメニュー（大メニュー／固定ミニメニュー共通） */
function jumpTo(el) {
var tabsH = 0; /* 本番版：タブが無いのでオフセットなし。固定メニューは最上部 top:0 */
var bar = document.getElementById("mfix");
var extra = bar.hidden? 56: bar.offsetHeight;
var y = el.getBoundingClientRect().top + window.scrollY - tabsH - extra - 10;
window.scrollTo({ top: Math.max(y, 0), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches? "auto": "smooth"});
}
document.addEventListener("click", function (e) {
var m = e.target.closest("a[data-menu]");
if (!m) return;
var pv = document.querySelector(".preview.on");
var t = pv && pv.querySelector('[data-anchor="' + m.dataset.menu + '"]');
if (!t) return;
e.preventDefault();
jumpTo(t);
});

/* 固定ミニメニュー：大メニューが画面外に出たら、案タブの下に小さく固定表示する */
function updMfix() {
var bar = document.getElementById("mfix");
var pv = document.getElementById("pv-w");
if (!pv) { bar.hidden = true; return;}
var menu = pv.querySelector("[data-bigmenu]");
var showBar = false;
if (menu) {
var mr = menu.getBoundingClientRect();
var pr = pv.getBoundingClientRect();
showBar = mr.bottom < 4 && pr.bottom > 140;
}
bar.hidden = !showBar;
if (showBar) {
var pr2 = pv.getBoundingClientRect();
bar.style.top = "0px";
bar.style.left = pr2.left + "px";
bar.style.width = pr2.width + "px";
var cls = "mfix";
pv.classList.forEach(function (c) { if (c !== "preview" && c !== "on") cls += " " + c;});
if (bar.className !== cls) bar.className = cls;
}
}
window.addEventListener("scroll", updMfix, { passive: true});
window.addEventListener("resize", updMfix);
window.addEventListener("load", updMfix);

/* 本番版：案の切り替えUIは無し（決定案4のみ表示） */
</script>
</body>
</html>
